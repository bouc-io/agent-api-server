# ── Added Phase 3: unit tests run in CI. Integration tests stay local-only
# (they need live Postgres/Redis/Ollama, unavailable in this CI).
unit-test:
  stage: test
  image: node:20
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - npm ci
    - npm run build
    - npm test
