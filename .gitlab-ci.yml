include:
  #- template: Nodejs.gitlab-ci.yml
  - template: SAST.gitlab-ci.yml
  #- template: DAST.latest.gitlab-ci.yml
  #- template: Container-Scanning.latest.gitlab-ci.yml
  #- template: Coverage-Fuzzing.latest.gitlab-ci.yml
  - template: Secret-Detection.gitlab-ci.yml
  - template: Dependency-Scanning.gitlab-ci.yml
  # Shared lint + unit-test jobs. Private project: the identity running the pipeline
  # needs at least Reporter on bouc-io/ci-templates or the include fails to resolve.
  - project: 'bouc-io/ci-templates'
    ref: main
    file: '/node.yml'
    inputs:
      # Ratchet ceiling: current count is 13 (7 no-unused-vars, 6 no-explicit-any).
      # Lower this as they are cleaned up; errors fail regardless.
      max_warnings: "13"
      build_before_test: true
      check_format: true

# This file is a template, and might need editing before it works on your project.
# This is a sample GitLab CI/CD configuration file that should run without any modifications.
# It demonstrates a basic 3 stage CI/CD pipeline. Instead of real tests or scripts,
# it uses echo commands to simulate the pipeline execution.
#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/index.html#stages
#
# You can copy and paste this template into a new `.gitlab-ci.yml` file.
# You should not add this template to an existing `.gitlab-ci.yml` file by using the `include:` keyword.
#
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml

stages: # List of stages for jobs, and their order of execution
  - build
  - test
  - dast
#  - deploy

variables:
  # Using CI_PIPELINE_ID for version increment
  VERSION: "1.0.${CI_PIPELINE_ID}"
  # When you use the dind service, you must instruct Docker to talk with
  # the daemon started inside of the service. The daemon is available
  # with a network connection instead of the default
  # /var/run/docker.sock socket. Docker 19.03 does this automatically
  # by setting the DOCKER_HOST in
  # https://github.com/docker-library/docker/blob/d45051476babc297257df490d22cbd806f1b11e4/19.03/docker-entrypoint.sh#L23-L29
  #
  # The 'docker' hostname is the alias of the service container as described at
  # https://docs.gitlab.com/ee/ci/services/#accessing-the-services.
  #
  # Specify to Docker where to create the certificates. Docker
  # creates them automatically on boot, and creates
  # `/certs/client` to share between the service and job
  # container, thanks to volume mount from config.toml
  DOCKER_TLS_CERTDIR: "/certs"

#
# Refer to:   - template: Docker.gitlab-ci.yml
#
docker-build:
  # Use the official docker image.
  #image: docker:cli
  image: docker:24.0.5
  stage: build
  #services:
  #  - docker:dind
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
    # WORKAROUND (added 2026-08-30) for "blob unknown to registry" on push.
    # Since BuildKit v0.32.0 the default attestation manifest is an OCI artifact
    # whose `subject` points at the image manifest, and BuildKit pushes it before
    # that subject exists. GitLab's registry enforces referential integrity and
    # rejects it with "blob unknown to registry - <subject digest>". Only fires
    # when the image manifest is new to the registry, so it looks intermittent.
    #   https://github.com/moby/buildkit/issues/7007
    #   https://gitlab.com/gitlab-org/gitlab/-/work_items/209008
    # REMOVE WHEN: verified unnecessary against the builder pinned below. The
    # v0.32.1 fix (moby/buildkit#7012) is already in the pinned v0.32.2, so this
    # variable may well be redundant, but that was never tested: every green
    # pipeline since 2026-08-30 has run with it set. To check, delete it and
    # confirm a build with genuinely new content still pushes cleanly. Note that
    # a CI-only edit does not change image content, so it will not exercise the
    # push path this guards.
    BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    # Register QEMU emulators for cross-architecture builds
    - docker run --rm --privileged multiarch/qemu-user-static:7.2.0-1 --reset -p yes
    # Create a context
    - docker context create buildercontext
    # Create a new buildx builder instance and set it to use the container driver
    - docker buildx create buildercontext --name mybuilder --driver-opt image=moby/buildkit:v0.32.2 --use
  # All branches are tagged with $DOCKER_IMAGE_NAME (defaults to commit ref slug)
  # Default branch is also tagged with `latest`
  script:
    - |
      TAGS="-t $DOCKER_IMAGE_NAME"
      if [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
        TAGS="$TAGS -t $CI_REGISTRY_IMAGE:latest -t $CI_REGISTRY_IMAGE:$VERSION"
      fi
      docker buildx build --builder=mybuilder --platform linux/amd64,linux/arm64 --cache-from type=registry,ref=$CI_REGISTRY_IMAGE:buildcache --cache-to type=registry,ref=$CI_REGISTRY_IMAGE:buildcache,mode=max --pull --push $TAGS .
  # Run this job in a branch where a Dockerfile exists
  rules:
    - if: $CI_COMMIT_BRANCH
      exists:
        - Dockerfile

#
#
#
# deploy-job: # This job runs in the deploy stage.
#   stage: deploy # It only runs when *both* jobs in the test stage complete successfully.
#   environment: production
#   script:
#     - echo "Deploying application..."
#     - echo "Application successfully deployed."

# ── Quality gates. Job definitions live in the private bouc-io/ci-templates project
# so a pipeline change is one commit instead of forty; see its README for the inputs.
# Unit tests only here: integration tests need live Postgres/Redis/Ollama and stay local.
lint:
  extends: .node-lint

unit-test:
  extends: .node-unit-test
